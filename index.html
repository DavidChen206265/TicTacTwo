<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacTwo</title>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script type="module" src="script.js"></script>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game">
        <h1>Tic Tac Two</h1>
        <div id="chalkboard">
        <div id="board">
            <div class="cell" data-index="0">X</div>
            <div class="cell" data-index="1">O</div>
            <div class="cell" data-index="2">X</div>
            <div class="cell" data-index="3">X</div>
            <div class="cell" data-index="4">O</div>
            <div class="cell" data-index="5">O</div>
            <div class="cell" data-index="6">X</div>
            <div class="cell" data-index="7">O</div>
            <div class="cell" data-index="8">O</div>
        </div>
    </div>
        <br>
        <button id="reset-btn">Reset Game</button>
    </div>
</body>

</html>
