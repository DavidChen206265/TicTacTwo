<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacTwo</title>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script type="module" src="script.js"></script>

    <link rel="icon" type="image/x-icon" href="icon512_rounded.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
</head>

<body>
        <h1>Tic Tac Two</h1>
            <div id="mainboard">
            <div id="chalkboard">
                <div id="board">
                    <div class="cell" id="0"></div>
                    <div class="cell" id="1"></div>
                    <div class="cell" id="2"></div>
                    <div class="cell" id="3"></div>
                    <div class="cell" id="4"></div>
                    <div class="cell" id="5"></div>
                    <div class="cell" id="6"></div>
                    <div class="cell" id="7"></div>
                    <div class="cell" id="8"></div>
                </div>
            </div>
            <div id="infoboard">
                <h2 id="name" class="infos">Name:</h2>
                <h2 id="xoro" class="infos">You are:</h2>
                <h2 id="turn" class="infos">Turn:</h2>
                <h2 id="room-display" class="infos">Room: </h2>
                <h2 id="winner-display" class="infos"></h2>
            </div>
            </div>
        <br>
        <div id="buttonBoard">
            <button id="init-btn" class="Buttons">Init Game</button>
            <button id="join-btn" class="Buttons">Join Game</button>
            <button id="exit-btn" class="Buttons">Exit Game</button>
            <button id="reset-btn" class="Buttons">Reset Game</button>
            <button id="name-btn" class="Buttons">Set Name</button>
            <button id="message-btn" class="Buttons">Send as Message</button>
            <span id="roomInputBox" class="Buttons">
                <span>Input</span>
                <input type="text" id="roomInput">
            </span>
            <button id="installButton" style="display: none;" class="Buttons">Install App</button>
        </div>
        <h2 id="player-display"></h2>
            <h2>Messages:</h2>
            <div id="message-display"></div>
        <svg style="display: none;">
            <filter id="chalk-filter">
              <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="5" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
            </filter>
          </svg>

        
        
</body>

</html>
